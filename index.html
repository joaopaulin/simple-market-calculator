<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compras</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: #d9eaff;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            height: calc(100vh - 100px);
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .display {
            flex: 1;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 20px;
            font-size: 30px;
            font-family: 'Roboto', sans-serif;
            resize: none;
            box-sizing: border-box;
            overflow-y: auto;
            background: #fff;
            height: 200px;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            background: #e0f0ff;
            border-top: 1px solid #ccc;
        }

        .key {
            padding: 15px;
            font-size: 24px;
            text-align: center;
            background: #cce5ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .key:active {
            background: #b0d4ff;
        }

        .key.enter {
            grid-row: span 2;
        }

        .key.comma {
            grid-column: span 2;
        }

        .key.space {
            grid-column: span 4;
            height: 60px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background-color: #d9eaff;
            border-top: 1px solid #ccc;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .total {
            font-size: 30px;
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="display" class="display" readonly></textarea>
        <div class="keyboard" id="keyboard"></div>
    </div>
    <div class="footer">
        <button class="key" onclick="calculateTotal()">Total</button>
        <div class="total" id="totalValue">R$ 0,00</div>
    </div>

    <script>
        const display = document.getElementById('display');
        const keyboard = document.getElementById('keyboard');
        const totalValue = document.getElementById('totalValue');
        
        const layout = [
            '7', '8', '9', 'X',
            '4', '5', '6', '←',
            '1', '2', '3', 'Enter',
            '0', ',', '␣'
        ];

        layout.forEach(key => {
            const button = document.createElement('button');
            button.textContent = key;
            button.className = 'key';
            if (key === 'Enter') button.classList.add('enter');
            if (key === ',') button.classList.add('comma');
            if (key === '␣') button.classList.add('space');
            button.onclick = () => handleKeyPress(key);
            keyboard.appendChild(button);
        });

        function handleKeyPress(key) {
            if (key === '←') {
                display.value = display.value.slice(0, -1);
            } else if (key === 'X') {
                display.value = '';
            } else if (key === 'Enter') {
                display.value += '\n';
            } else if (key === '␣') {
                display.value += ' ';
            } else {
                display.value += key;
            }
        }

        function calculateTotal() {
            const lines = display.value.split('\n');
            let total = 0;

            lines.forEach(line => {
                const numbers = line.replace(',', '.').split(/\s+/).map(n => parseFloat(n.replace(',', '.'))).filter(n => !isNaN(n));
                if (numbers.length === 2) {
                    total += numbers[0] * numbers[1];
                } else if (numbers.length === 1) {
                    total += numbers[0];
                }
            });

            totalValue.textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }
    </script>
</body>
</html>
